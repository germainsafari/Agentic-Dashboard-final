// ── Creative Director Dashboard data model ────────────────────────────────
// KPI targets (per Figma):
//  - utilization     → 75% target (donut)
//  - billable        → 65% goal
//  - fta             → 15% goal   (First-Time Acceptance Rate)
//  - estimate        → 80% goal   (Projects in Estimate)
//  - newBizWin       → 30% goal
//  - existingWin     → 60% goal
// "achieved" = value meets or exceeds goal.

const KPI_META = [
  { key: "utilization", label: "Project utilization",        goal: 75, kind: "donut",  note: "Billable vs available hours" },
  { key: "billable",    label: "Billable hours",             goal: 65, kind: "bar",    note: "% of tracked hours billable to clients" },
  { key: "fta",         label: "First-Time Acceptance Rate", goal: 15, kind: "bar",    note: "10 projects analyzed (04/05/2026)" },
  { key: "estimate",    label: "Projects in Estimate",       goal: 80, kind: "bar",    note: "Projects within estimate ± tolerance" },
  { key: "newBizWin",   label: "New Business Pitch Win Rate",goal: 30, kind: "bar",    note: "10 projects analyzed (04/05/2026)" },
  { key: "existingWin", label: "Existing Client Pitch Win Rate", goal: 60, kind: "bar", note: "10 projects analyzed (04/05/2026)" },
];

// deterministic pseudo-random so values are stable across reloads
const seeded = (seed) => {
  let s = seed;
  return () => {
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
};

const gen = (seedBase, goal) => {
  const r = seeded(seedBase);
  // spread: some below goal, some close, a few above
  const quarters = ["Q1", "Q2", "Q3", "Q4"].map((q, i) => {
    const rr = r();
    // distribute around goal, slight upward trend through year
    const lift = i * (goal * 0.04);
    const variance = (rr - 0.45) * goal * 0.9;
    let v = Math.round(goal + variance + lift);
    if (v < 2) v = 2;
    if (v > 100) v = 100;
    return [q, v];
  });
  return Object.fromEntries(quarters);
};

const makeTeam = (seed, name, lead) => {
  const rand = seeded(seed + 7);
  return {
  name,
  lead,
  people: Math.round(4 + seeded(seed)() * 8),
  activeProjects: Math.round(3 + seeded(seed + 1)() * 9),
  kpis: Object.fromEntries(
    KPI_META.map((m, i) => [m.key, gen(seed + i * 13, m.goal)])
  ),
  // projects analyzed per sample KPI (FTA, new business, existing)
  projectsAnalyzed: {
    fta:         Math.round(6 + rand() * 10),
    newBizWin:   Math.round(3 + rand() * 8),
    existingWin: Math.round(8 + rand() * 14),
  },
}};

const DIRECTORS = [

      { id: "e2", team: "Team 02", project: "Aurora App Redesign",    score: 58, quarter: "Q2", opened: "04 Apr",  severity: "medium", reason: "Key stakeholder rotation; direction reset requested" },
      { id: "e3", team: "Team 03", project: "Halcyon Hotels — OOH",   score: 61, quarter: "Q2", opened: "18 Apr",  severity: "medium", reason: "Print-vendor timeline compressed by 2 weeks" },
      { id: "e4", team: "Team 04", project: "Meridian Q3 Campaign",   score: 29, quarter: "Q3", opened: "02 Jul",  severity: "high",   reason: "Budget reduced mid-production, deliverables unchanged" },
    ],
    updated: "04 May 2026 · 14:32 CET",
  },
  {
    id: "tomasz",
    name: "Tomasz Rybak",
    title: "Creative Director",
    location: "Barcelona",
    initials: "TR",
    teamCount: 3,
    teams: [
      makeTeam(512, "Team 01", "E. Martín"),
      makeTeam(623, "Team 02", "R. López"),
      makeTeam(734, "Team 03", "S. Gómez"),
    ],
    escalations: [
      { id: "e1", team: "Team 01", project: "Vanta Fintech Launch",   score: 48, quarter: "Q1", opened: "22 Feb", severity: "medium", reason: "Legal review added 3 weeks to motion deliverables" },
      { id: "e2", team: "Team 03", project: "Ocio Festival Identity", score: 33, quarter: "Q2", opened: "09 May", severity: "high",   reason: "Client pivoted from festival to year-round platform" },

      { id: "e2", team: "Team 04", project: "Nordic Bank — Annual",  score: 39, quarter: "Q1", opened: "28 Mar", severity: "high",   reason: "Approval chain expanded to 11 stakeholders" },

  <script type="text/babel">
// KPI visual primitives — donut, goal-bar, mini tooltip
// Shared across column/row/grid layouts.

const COLORS = {
  ink: "#0A0A0A",
  inkSoft: "#3A3A3A",
  muted: "#5A5A5A",
  rule: "#111111",
  paper: "#FFFFFF",
  // brand
  tangerine: "#FF5A3C",
  turquoise: "#00DDC2",
  beige:     "#EBDBC3",
  gray01:    "#D9D9D9",
  gray02:    "#5A5A5A",
  gray03:    "#B0B0B0",
  hairline:  "#1A1A1A",
  subtleBg:  "#F6F4EF",
};

// Status helper
const statusOf = (value, goal) => {
  if (value >= goal) return "achieved";
  if (value >= goal * 0.75) return "onTrack";
  return "off";
};

const statusColor = (s, emphasis = "balanced") => {
  if (s === "achieved") return COLORS.turquoise;
  if (s === "onTrack") return emphasis === "bold" ? COLORS.beige : "#8A8A8A";
  return COLORS.tangerine;
};

// Donut for utilization
function Donut({ value, goal, size = 148, thickness = 6 }) {
  const status = statusOf(value, goal);
  const color = statusColor(status);
  const r = (size - thickness) / 2;
  const c = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(100, value)) / 100;
  const dash = c * pct;
  const goalAngle = (goal / 100) * 360 - 90;
  const goalX = size / 2 + (r + thickness / 2 + 1) * Math.cos((goalAngle * Math.PI) / 180);
  const goalY = size / 2 + (r + thickness / 2 + 1) * Math.sin((goalAngle * Math.PI) / 180);
  const goalInX = size / 2 + (r - thickness / 2 - 3) * Math.cos((goalAngle * Math.PI) / 180);
  const goalInY = size / 2 + (r - thickness / 2 - 3) * Math.sin((goalAngle * Math.PI) / 180);

  return (
    <div style={{ position: "relative", width: size, height: size }}>
      <svg width={size} height={size} style={{ display: "block" }}>
        {/* track */}
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={COLORS.gray01} strokeWidth={thickness} />
        {/* value */}
        <circle
          cx={size/2} cy={size/2} r={r}
          fill="none"
          stroke={color}
          strokeWidth={thickness}
          strokeDasharray={`${dash} ${c - dash}`}
          strokeDashoffset={c / 4}
          strokeLinecap="butt"
          style={{ transition: "stroke-dasharray 0.6s cubic-bezier(.2,.8,.2,1)" }}
        />
        {/* goal tick */}
        <line x1={goalInX} y1={goalInY} x2={goalX} y2={goalY} stroke={COLORS.ink} strokeWidth={1.5} />
      </svg>
      <div style={{
        position: "absolute", inset: 0,
        display: "flex", flexDirection: "column",
        alignItems: "center", justifyContent: "center",
        fontFamily: "var(--serif)",
      }}>
        <div style={{ fontSize: 34, fontWeight: 400, letterSpacing: "-0.02em", lineHeight: 1, color: COLORS.ink }}>
          {value}<span style={{ fontSize: 16, marginLeft: 1 }}>%</span>
        </div>
        <div style={{ fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: COLORS.muted, marginTop: 4 }}>
          {goal}% target
        </div>
      </div>
    </div>
  );
}

// Horizontal goal bar
function GoalBar({ value, goal, width = 180, compact = false }) {
  const status = statusOf(value, goal);
  const color = statusColor(status);
  const h = compact ? 6 : 8;
  const v = Math.max(0, Math.min(100, value));
  return (
    <div style={{ width: "100%" }}>
      <div style={{
        display: "flex", alignItems: "baseline", justifyContent: "space-between",
        marginBottom: 6, gap: 8,
      }}>
        <span style={{ fontFamily: "var(--serif)", fontSize: 22, letterSpacing: "-0.02em", color: COLORS.ink, lineHeight: 1 }}>
          {value}<span style={{ fontSize: 12, color: COLORS.muted }}>%</span>
        </span>
        <span style={{ fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: COLORS.muted }}>
          {goal}% goal
        </span>
      </div>
      <div style={{ position: "relative", width: "100%", height: h, background: COLORS.gray01 }}>
        <div
          style={{
            position: "absolute", left: 0, top: 0, bottom: 0,
            width: `${v}%`,
            background: color,
            transition: "width 0.5s cubic-bezier(.2,.8,.2,1)",
          }}
        />
        <div style={{
          position: "absolute", top: -3, bottom: -3, left: `${goal}%`,
          width: 1, background: COLORS.ink,
        }} />
      </div>
    </div>
  );
}

// Small inline sparkline across Q1–Q4 for drill-in
function QuarterSpark({ values, goal, width = 90, height = 28 }) {
  const max = Math.max(...values, goal, 100);
  const min = 0;
  const step = width / (values.length - 1);
  const pts = values.map((v, i) => [i * step, height - ((v - min) / (max - min)) * height]);
  const d = pts.map(([x, y], i) => (i === 0 ? `M${x},${y}` : `L${x},${y}`)).join(" ");
  const gy = height - ((goal - min) / (max - min)) * height;
  return (
    <svg width={width} height={height} style={{ display: "block" }}>
      <line x1={0} y1={gy} x2={width} y2={gy} stroke={COLORS.gray03} strokeWidth={1} strokeDasharray="2 3" />
      <path d={d} fill="none" stroke={COLORS.ink} strokeWidth={1.25} />
      {pts.map(([x, y], i) => (
        <circle key={i} cx={x} cy={y} r={2} fill={COLORS.ink} />
      ))}
    </svg>
  );
}

Object.assign(window, { COLORS, statusOf, statusColor, Donut, GoalBar, QuarterSpark });

  </script>
  <script type="text/babel">
// Layouts: Columns (Figma), Rows, Cards
// Shared: TeamHeader, KpiLabel, KpiTooltip

function useHoverKpi() {
  const [hover, setHover] = React.useState(null); // { teamIdx, kpiKey, x, y }
  const handlers = (teamIdx, kpiKey) => ({});
  return [hover, handlers];
}

function KpiTooltip({ data, meta, quarter, values }) {
  if (!data) return null;
  return (
    <div style={{
      position: "fixed",
      left: data.x,
      top: data.y - 12,
      transform: "translate(-50%, -100%)",
      background: COLORS.ink,
      color: "#fff",
      padding: "10px 12px",
      fontSize: 11,
      lineHeight: 1.45,
      maxWidth: 240,
      pointerEvents: "none",
      zIndex: 100,
      boxShadow: "0 12px 30px rgba(0,0,0,0.18)",
    }}>
      <div style={{ letterSpacing: "0.08em", textTransform: "uppercase", color: COLORS.gray03, fontSize: 9, marginBottom: 4 }}>
        {meta.label}
      </div>
      <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 6 }}>
        <div style={{ fontFamily: "var(--serif)", fontSize: 24, lineHeight: 1, letterSpacing: "-0.02em" }}>
          {values[quarter]}%
        </div>
        <div style={{ fontSize: 10, color: COLORS.gray03 }}>
          vs {meta.goal}% goal · {quarter}
        </div>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 8 }}>
        <QuarterSpark values={["Q1","Q2","Q3","Q4"].map(q => values[q])} goal={meta.goal} />
        <div style={{ fontSize: 10, color: COLORS.gray03, lineHeight: 1.4 }}>
          {["Q1","Q2","Q3","Q4"].map(q => (
            <div key={q} style={{ display: "flex", justifyContent: "space-between", gap: 10, fontVariantNumeric: "tabular-nums" }}>
              <span>{q}</span><span style={{ color: q === quarter ? "#fff" : COLORS.gray03 }}>{values[q]}%</span>
            </div>
          ))}
        </div>
      </div>
      <div style={{ marginTop: 8, fontSize: 10, color: COLORS.gray03, borderTop: "1px solid #333", paddingTop: 6 }}>
        {meta.note}
      </div>
    </div>
  );
}

function TeamHeader({ team, idx, onClick, variant = "column" }) {
  return (
    <button
      onClick={onClick}
      style={{
        width: "100%", textAlign: "left",
        background: "transparent", border: 0, padding: 0, cursor: "pointer",
        display: "flex", flexDirection: "column", gap: 4,
      }}
    >
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 8 }}>
        <div style={{ fontFamily: "var(--serif)", fontSize: 22, letterSpacing: "-0.01em", color: COLORS.ink, lineHeight: 1 }}>
          {team.name}
        </div>
        {variant !== "card" && (
          <div style={{
            fontSize: 10, letterSpacing: "0.1em", textTransform: "uppercase",
            color: COLORS.muted, fontVariantNumeric: "tabular-nums",
          }}>
            {String(idx + 1).padStart(2, "0")}
          </div>
        )}
      </div>
      <div style={{ fontSize: 11, color: COLORS.muted, lineHeight: 1.4 }}>
        {team.people} people · {team.activeProjects} active projects
      </div>
      <div style={{ fontSize: 11, color: COLORS.muted }}>Lead: {team.lead}</div>
    </button>
  );
}

// ── COLUMNS layout (default, matches Figma) ───────────────────────────────
function LayoutColumns({ director, quarter, onTeamClick, escalationsByTeam }) {
  const [hover, handlers] = useHoverKpi();
  const cols = director.teams.length;
  return (
    <div style={{ position: "relative" }}>
      <div style={{
        display: "grid",
        gridTemplateColumns: `220px repeat(${cols}, minmax(0, 1fr))`,
        columnGap: 0,
        borderTop: `1px solid ${COLORS.hairline}`,
      }}>
        {/* left label column */}
        <div style={{ borderRight: `1px solid ${COLORS.hairline}` }}>
          <div style={{ padding: "20px 20px 18px 0", borderBottom: `1px solid ${COLORS.hairline}` }}>
            <div style={{ fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase", color: COLORS.muted }}>
              Quarter in view
            </div>
            <div style={{ fontFamily: "var(--serif)", fontSize: 36, letterSpacing: "-0.02em", lineHeight: 1, marginTop: 6 }}>
              {quarter}
            </div>
          </div>
          {KPI_META.map((meta, i) => (
            <div key={meta.key} style={{
              padding: "22px 20px 22px 0",
              borderBottom: i < KPI_META.length - 1 ? `1px solid ${COLORS.hairline}` : "none",
              minHeight: meta.kind === "donut" ? 190 : 120,
              display: "flex", flexDirection: "column", justifyContent: "center", gap: 6,
            }}>
              <div style={{ fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase", color: COLORS.muted }}>
                KPI {String(i + 1).padStart(2, "0")}
              </div>
              <div style={{ fontFamily: "var(--serif)", fontSize: 20, letterSpacing: "-0.01em", color: COLORS.ink, lineHeight: 1.15 }}>
                {meta.label}
              </div>
              <div style={{ fontSize: 11, color: COLORS.muted, lineHeight: 1.4 }}>
                Goal {meta.goal}% · {meta.note}
              </div>
            </div>
          ))}
        </div>

        {/* team columns */}
        {director.teams.map((team, ti) => {
          const hasEsc = escalationsByTeam[team.name]?.length > 0;
          return (
            <div key={team.name} style={{
              borderRight: ti < cols - 1 ? `1px solid ${COLORS.hairline}` : "none",
              position: "relative",
            }}>
              <div style={{ padding: "20px 20px 18px 20px", borderBottom: `1px solid ${COLORS.hairline}`, position: "relative" }}>
                <TeamHeader team={team} idx={ti} onClick={() => onTeamClick(ti)} />
                {hasEsc && (
                  <div
                    onClick={(e) => { e.stopPropagation(); onTeamClick(ti, "escalation"); }}
                    style={{
                      position: "absolute", top: 16, right: 16,
                      width: 8, height: 8, borderRadius: "50%",
                      background: COLORS.tangerine, cursor: "pointer",
                      boxShadow: `0 0 0 4px ${COLORS.tangerine}22`,
                    }}
                    title={`${escalationsByTeam[team.name].length} escalation(s)`}
                  />
                )}
              </div>
              {KPI_META.map((meta, i) => {
                const values = team.kpis[meta.key];
                const v = values[quarter];
                return (
                  <div key={meta.key}
                    {...handlers(ti, meta.key)}
                    style={{
                      padding: "22px 20px",
                      borderBottom: i < KPI_META.length - 1 ? `1px solid ${COLORS.hairline}` : "none",
                      minHeight: meta.kind === "donut" ? 190 : 120,
                      display: "flex", alignItems: "center", justifyContent: "center",
                      cursor: "default",
                      transition: "background 0.12s ease",
                      background: hover?.teamIdx === ti && hover?.kpiKey === meta.key ? COLORS.subtleBg : "transparent",
                    }}
                  >
                    {meta.kind === "donut"
                    ? <Donut value={v} goal={meta.goal} size={148} thickness={6} />
                      : <GoalBar value={v} goal={meta.goal} />}
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>

      {hover && (() => {
        const team = director.teams[hover.teamIdx];
        const meta = KPI_META.find(m => m.key === hover.kpiKey);
        return <KpiTooltip data={hover} meta={meta} quarter={quarter} values={team.kpis[hover.kpiKey]} />;
      })()}
    </div>
  );
}

// ── ROWS layout (one team per row, KPIs across) ───────────────────────────
function LayoutRows({ director, quarter, onTeamClick, escalationsByTeam }) {
  const [hover, handlers] = useHoverKpi();
  return (
    <div style={{ position: "relative", paddingTop: 28 }}>
      {/* column header */}
      <div style={{
        display: "grid",
        gridTemplateColumns: `260px repeat(${KPI_META.length}, minmax(0, 1fr))`,
        padding: "12px 0",
        borderBottom: `1px solid ${COLORS.hairline}`,
      }}>
        <div style={{ fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase", color: COLORS.muted, padding: "0 20px 0 0" }}>
          Team · {quarter}
        </div>
        {KPI_META.map((meta, i) => (
          <div key={meta.key} style={{ padding: "0 16px" }}>
            <div style={{ fontFamily: "var(--serif)", fontSize: 14, letterSpacing: "-0.01em", color: COLORS.ink, lineHeight: 1.2 }}>
              {meta.shortLabel || meta.label}
            </div>
            <div style={{ fontSize: 10, color: COLORS.muted, marginTop: 2 }}>Goal {meta.goal}%</div>
          </div>
        ))}
      </div>
      {director.teams.map((team, ti) => {
        const hasEsc = escalationsByTeam[team.name]?.length > 0;
        return (
          <div key={team.name} style={{
            display: "grid",
            gridTemplateColumns: `260px repeat(${KPI_META.length}, minmax(0, 1fr))`,
            alignItems: "center",

              return (
                <div key={meta.key} style={{ borderTop: `1px solid ${COLORS.hairline}`, paddingTop: 14 }}>
                  <div style={{ fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: COLORS.muted, marginBottom: 4 }}>
                    {meta.label}
                  </div>
                  <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
                    <div style={{ fontFamily: "var(--serif)", fontSize: 26, letterSpacing: "-0.02em", color: COLORS.ink, lineHeight: 1 }}>
                      {values.Q4}%
                    </div>
                    <div style={{ fontSize: 11, color: q4 > q1 ? COLORS.turquoise : COLORS.tangerine }}>
                      {q4 > q1 ? "▲" : "▼"} {Math.abs(q4 - q1)}pt
                    </div>
                  </div>
                  <div style={{ marginTop: 8 }}>
                    <QuarterSpark values={["Q1","Q2","Q3","Q4"].map(q => values[q])} goal={meta.goal} width={160} height={32} />
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </>
  );
}

Object.assign(window, { Header, QuarterTabs, EscalationPanel, TeamDrilldown });

  </script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "quarter": "Q2",
      "showEscalationBanner": true,
      "directorId": "marta"
    }/*EDITMODE-END*/;

    function App() {
      const [directorId, setDirectorId] = React.useState(() => localStorage.getItem("cd.dir") || TWEAK_DEFAULTS.directorId);
      const [quarter, setQuarter] = React.useState(() => localStorage.getItem("cd.q") || TWEAK_DEFAULTS.quarter);
      // Rows on desktop, Cards on mobile (auto via matchMedia)
      const [isMobile, setIsMobile] = React.useState(() => window.matchMedia("(max-width: 1280px)").matches);
      React.useEffect(() => {
        const mq = window.matchMedia("(max-width: 1280px)");
        const on = (e) => setIsMobile(e.matches);
        mq.addEventListener("change", on);
        return () => mq.removeEventListener("change", on);
      }, []);
      const layout = isMobile ? "cards" : "rows";
      const [showBanner, setShowBanner] = React.useState(TWEAK_DEFAULTS.showEscalationBanner);
      const [escOpen, setEscOpen] = React.useState(false);
      const [drill, setDrill] = React.useState(null); // { teamIdx, focusEscalation }
      const [tweaksOn, setTweaksOn] = React.useState(false);

      React.useEffect(() => localStorage.setItem("cd.dir", directorId), [directorId]);
      React.useEffect(() => localStorage.setItem("cd.q", quarter), [quarter]);


      // Tweak-mode protocol
      React.useEffect(() => {
        const onMsg = (e) => {
          if (e.data?.type === "__activate_edit_mode") setTweaksOn(true);
          if (e.data?.type === "__deactivate_edit_mode") setTweaksOn(false);
        };
        window.addEventListener("message", onMsg);
        window.parent.postMessage({ type: "__edit_mode_available" }, "*");
        return () => window.removeEventListener("message", onMsg);
      }, []);

      const director = DIRECTORS.find(d => d.id === directorId) || DIRECTORS[0];
      const escalationsByTeam = React.useMemo(() => {
        const o = {};
        director.escalations.forEach(e => { (o[e.team] = o[e.team] || []).push(e); });
        return o;
      }, [director]);

      const Layout = { rows: LayoutRows, cards: LayoutCards }[layout];

      const handleTeamClick = (teamIdx, mode) => {
        setDrill({ teamIdx, focusEscalation: mode === "escalation" });
      };

      return (
        <div data-screen-label="01 Dashboard" data-om-validate style={{ minHeight: "100vh", background: "#fff", maxWidth: 1680, margin: "0 auto", boxShadow: "0 0 40px rgba(0,0,0,0.04)" }}>
          <Header
            director={director}
            escalations={director.escalations}
            onEscalationClick={() => setEscOpen(true)}
          />

          <QuarterBar quarter={quarter} onChange={setQuarter} />

          <div style={{ padding: layout === "cards" ? "28px 48px 64px 48px" : "0 48px 64px 48px" }}>
            <Layout
              director={director}
              quarter={quarter}
              onTeamClick={handleTeamClick}
              escalationsByTeam={escalationsByTeam}
            />
          </div>

          <footer style={{
            padding: "18px 48px", borderTop: `1px solid ${COLORS.hairline}`,
            display: "flex", justifyContent: "space-between",
            fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: COLORS.muted,
          }}>
            <span>Admind · Creative Director Dashboard · 2026</span>
            <span>Data refresh every 5 min</span>
          </footer>

          <EscalationPanel
            open={escOpen}
            onClose={() => setEscOpen(false)}
            director={director}
          />

          {drill && (
            <TeamDrilldown
              team={director.teams[drill.teamIdx]}
              director={director}
              focusEscalation={drill.focusEscalation}
              onClose={() => setDrill(null)}
            />
          )}

        </div>
      );
    }

    // keyboard shortcuts
    window.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT") return;
      const map = { "1": "Q1", "2": "Q2", "3": "Q3", "4": "Q4" };
      if (map[e.key]) {
        localStorage.setItem("cd.q", map[e.key]);
        // force re-render
        window.dispatchEvent(new Event("cd-quarter"));
      }
    });

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
