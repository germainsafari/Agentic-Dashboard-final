services:
  - type: web
    name: admind-agentic-dashboard
    runtime: node
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    # Call /api/warmup after every deploy so the in-memory + file cache is
    # pre-populated before the first real user request.
    healthCheckPath: /api/warmup

    envVars:
      # ── Scoro ─────────────────────────────────────────────────────────────
      - key: COMPANY_BASE_URL
        value: https://admindagency.scoro.com/api/v2
      - key: SCORO_API_KEY
        sync: false          # set manually in Render dashboard
      - key: SCORO_COMPANY_ACCOUNT_ID
        value: admindagency
      - key: KPI_YEAR
        value: "2026"
      - key: SYNC_INTERVAL_DAYS
        value: "3"

      # ── Scoro user credentials (needed for bookmarks/offer-prep lookup) ──
      - key: SCORO_USER_USERNAME
        sync: false          # set manually in Render dashboard
      - key: SCORO_USER_PASSWORD
        sync: false          # set manually in Render dashboard
      - key: SCORO_OFFER_PREP_BOOKMARK_ID
        sync: false          # set manually in Render dashboard

      # ── OpenAI ────────────────────────────────────────────────────────────
      - key: OPENAI_API_KEY
        sync: false          # set manually in Render dashboard

      # ── Neon Postgres (primary persistent snapshot store) ───────────────
      - key: DATABASE_URL
        sync: false

      # ── Upstash Redis (optional legacy fallback if DATABASE_URL unset) ──
      - key: KV_REST_API_URL
        sync: false
      - key: KV_REST_API_TOKEN
        sync: false

      # ── Cron auth — set the SAME value on the cron job below ─────────────
      - key: CRON_SECRET
        sync: false

      # ── Next.js ────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production

  # Full Scoro refresh every 3 days — triggers /api/sync per director on the web service.
  - type: cron
    name: sync-all-directors
    schedule: "0 5 */3 * *"
    runtime: node
    buildCommand: pnpm install
    startCommand: node scripts/cron-sync-all.mjs
    envVars:
      - key: APP_BASE_URL
        fromService:
          type: web
          name: admind-agentic-dashboard
          property: host
      # Must match CRON_SECRET on admind-agentic-dashboard web service.
      - key: CRON_SECRET
        sync: false
